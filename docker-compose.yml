services:
  web:
    container_name: smartTradePOS-PRO_app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      # We ONLY expose 8090 to localhost, forcing traffic to go through your Nginx reverse proxy
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ZRA_TPIN: ${ZRA_TPIN}
      ZRA_BHF_ID: ${ZRA_BHF_ID}
      ZRA_DVC_SRL_NO: ${ZRA_DVC_SRL_NO}
      ZRA_VSDC_URL: ${ZRA_VSDC_URL}
      ZRA_PORTAL_URL: ${ZRA_PORTAL_URL:-}
      VSIAS_URL: ${VSIAS_URL:-http://localhost:8035}
      VSIAS_INTERNAL_URL: ${VSIAS_INTERNAL_URL:-http://host.docker.internal:8045}
      VSIAS_BRIDGE_TOKEN: ${VSIAS_BRIDGE_TOKEN:-bbc8efdd47865d4f449ea3b95a38a278}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartTradePOS-net
    # Removed SSL mods because Nginx will handle SSL termination
    command: sh -c "a2enmod headers && a2enmod rewrite && apache2-foreground"

  db:
    container_name: smartTradePOS_db
    image: mysql:8.3
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_HOST: "%"
      TZ: ${TZ}
    # REMOVED port mapping: 3306 is now only accessible internally to other containers
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/smartTradePOS_db.sql:/docker-entrypoint-initdb.d/01-smartTradePOS_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartTradePOS-net

  vsdc:
    image: tomcat:9.0-jre8-temurin
    container_name: vsdc
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2 -Djsse.enableSNIExtension=true"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # REMOVED port mapping: 8080 is now only accessible internally to the PHP container
    volumes:
      - ./api:/opt/zra-api:ro
      - ./docker/vsdc/entrypoint.sh:/usr/local/bin/vsdc-entrypoint.sh:ro
      - vsdc_webapps:/usr/local/tomcat/webapps
    command: ["bash", "/usr/local/bin/vsdc-entrypoint.sh"]
    restart: always
    networks:
      - smartTradePOS-net

volumes:
  db_data:
  vsdc_webapps:

networks:
  smartTradePOS-net:
    driver: bridge
