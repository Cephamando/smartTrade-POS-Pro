services:
  web:
    container_name: smartTradePOS-PRO_app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8090}:80"
      - "${APP_PORT_HTTPS:-8443}:443"
    volumes:
      - ./:/var/www/html
      - ./docker/apache/ssl.conf:/etc/apache2/sites-available/ssl.conf
      - ./odeliazm.com-ssl-bundle:/etc/apache2/ssl:ro
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ZRA_TPIN: ${ZRA_TPIN}
      ZRA_BHF_ID: ${ZRA_BHF_ID}
      ZRA_DVC_SRL_NO: ${ZRA_DVC_SRL_NO}
      ZRA_VSDC_URL: ${ZRA_VSDC_URL}
    depends_on:
      db:
        condition: service_healthy   # ✅ Wait for MySQL to be READY, not just started
    networks:
      - smartTradePOS-net
    command: sh -c "a2enmod ssl && a2enmod headers && a2enmod rewrite && a2ensite ssl.conf && apache2-foreground"

  db:
    container_name: smartTradePOS_db
    image: mysql:8.3
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_HOST: "%"
      TZ: ${TZ}
    ports:
      - "${DB_PORT_EXTERNAL:-8091}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:                                          # ✅ Addedhealthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # Give MySQL time to initialize on first run
    networks:
      - smartTradePOS-net

  vsdc:
    image: tomcat:8.5-jdk8-openjdk
    container_name: vsdc
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${VSDC_PORT:-8080}:8080"
    volumes:
      - ./api/sandboxvsdc/sandboxvsdc1.0.8.0.war:/usr/local/tomcat/webapps/sandboxvsdc.war
    restart: always
    networks:
      - smartTradePOS-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smartTradePOS_pma
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8092}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy   # ✅ Same fix
    networks:
      - smartTradePOS-net

  adminer:
    image: adminer
    container_name: smartTradePOS_adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8093}:8080"
    depends_on:
      db:
        condition: service_healthy   # ✅ Same fix
    networks:
      - smartTradePOS-net

volumes:
  db_data:

networks:
  smartTradePOS-net:
    driver: bridge
