; Locked runtime. Apache and the CLI both load this file.
; Source files are zero-byte placeholders; execution comes only from the
; precompiled OPcache file cache built by the same PHP binary.
opcache.enable=1
opcache.enable_cli=1
opcache.file_cache=/var/www/opcache
opcache.file_cache_only=1
opcache.file_cache_consistency_checks=1
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=0
opcache.enable_file_override=1
opcache.validate_permission=1
opcache.file_update_protection=0
opcache.jit=disable
opcache.jit_buffer_size=0
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.error_log=
