; Match the development image limits. Africa/Lusaka is the application timezone.
; Hardened for CVE-2026-109618 & CVE-2026-109619.
memory_limit = 512M
upload_max_filesize = 16M
post_max_size = 32M
max_file_uploads = 12
max_input_vars = 2000
session.upload_progress.enabled = 0
max_execution_time = 300
display_errors = Off
log_errors = On
date.timezone = Africa/Lusaka
